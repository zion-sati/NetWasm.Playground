<!doctype html><title>Trusted TUnit generator worker</title>
<textarea id="source" rows="16" cols="90" spellcheck="false"></textarea>
<button id="generate" disabled>Generate catalog</button><pre id="status">Loading generator worker</pre>
<script type="module">
const worker = new Worker('./generator-worker.mjs', { type: 'module' });
let nextId = 0; const pending = new Map();
window.ready = new Promise((resolve, reject) => {
  worker.onmessage = ({ data }) => {
    if (data.ready) {
      window.boot = data; document.querySelector('#generate').disabled = false;
      document.querySelector('#status').textContent = 'Generator ready'; resolve(data);
    } else if (data.fatal) reject(new Error(data.fatal));
    else {
      const request = pending.get(data.id); pending.delete(data.id);
      data.error ? request.reject(new Error(data.error)) : request.resolve(data.result);
    }
  };
  worker.onerror = error => reject(new Error(error.message));
});
window.generate = source => new Promise((resolve, reject) => {
  const id = ++nextId; pending.set(id, { resolve, reject }); worker.postMessage({ id, source });
});
document.querySelector('#generate').onclick = async () => {
  const button = document.querySelector('#generate'); button.disabled = true; window.lastResult = null;
  try {
    window.lastResult = await window.generate(document.querySelector('#source').value);
    document.querySelector('#status').textContent = window.lastResult.success
      ? `${window.lastResult.catalogCaseCount} catalog cases generated`
      : `${window.lastResult.stage}: ${(window.lastResult.generatorDiagnostics ?? [])
          .concat(window.lastResult.diagnostics ?? []).map(item => item.code).join(', ')}`;
  } finally { button.disabled = false; }
};
</script>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Verify public package boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_*.py'
      - name: Verify site identity contract
        run: node --test eng/tests/*.test.mjs
      - run: npm run typecheck
      - name: Build application shell
        run: npm run build

  browser-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Qualify browser startup, navigation, workers, and Monaco input
        env:
          PLAYGROUND_BROWSER: ${{ matrix.browser }}
          PLAYGROUND_EVIDENCE: ${{ runner.temp }}/browser-compatibility
          PLAYGROUND_URL: http://127.0.0.1:5173/
        run: |
          npm run dev -- --port 5173 --strictPort > "$RUNNER_TEMP/playground.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            curl --fail --silent "$PLAYGROUND_URL" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "$PLAYGROUND_URL" >/dev/null
          node eng/browser-smoke/cross-origin-isolation.mjs
          node eng/browser-smoke/editor-input.mjs
          node eng/browser-smoke/worker-channel.mjs
          node eng/browser-smoke/back-navigation.mjs

  released-toolchain:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Playground
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Install browser and Wasmtime
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          archive="$RUNNER_TEMP/wasmtime.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            'ca1fc56d1afc40c8782e96c297fd182a0da162f9a8f52a1e7b094e1dd648e178' \
            "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: Install pinned NativeAOT-LLVM Emscripten toolchain
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/nativeaot-pins.env"
          import json
          from pathlib import Path
          candidate = json.loads(Path('eng/upstream-sources.json').read_text())['nativeAotLlvmCandidate']
          print(f"EMSDK_REVISION={candidate['emsdkRevision']}")
          print(f"EMSCRIPTEN_VERSION={candidate['emscriptenVersion']}")
          PY
          source "$RUNNER_TEMP/nativeaot-pins.env"
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth=1 origin "$EMSDK_REVISION"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Build and qualify released browser toolchain
        env:
          NETWASM_RELEASED_WORK: ${{ runner.temp }}/netwasm-playground-released
          NETWASM_NATIVEAOT_EMSDK: ${{ runner.temp }}/emsdk
        run: bash eng/qualify-released-toolchain.sh
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: released-browser-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/netwasm-playground-released/evidence
            ${{ runner.temp }}/netwasm-playground-released/production-server.log
          if-no-files-found: warn
          retention-days: 14

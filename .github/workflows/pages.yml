name: Pages

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    outputs:
      toolchain_id: ${{ steps.toolchain.outputs.id }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release tag
        run: |
          expected_tag=$(python3 -c 'import json; print(json.load(open("eng/toolchain-release.json"))["tag"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$expected_tag"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Install verified browser toolchain
        id: toolchain
        run: |
          python3 eng/toolchain-release.py install
          echo "id=$(python3 -c 'import json; print(json.load(open("public/toolchain/index.json"))["id"])')" >> "$GITHUB_OUTPUT"
      - name: Build production site
        env:
          PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned Wasmtime
        run: |
          curl --fail --location --retry 3 --output /tmp/wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            'ca1fc56d1afc40c8782e96c297fd182a0da162f9a8f52a1e7b094e1dd648e178' \
            /tmp/wasmtime.tar.xz | sha256sum --check --strict
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: Smoke-test production build
        env:
          PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/
          PLAYGROUND_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
          PLAYGROUND_EVIDENCE: .cache/pages-smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            curl --fail --silent "$PLAYGROUND_URL" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "$PLAYGROUND_URL" >/dev/null
          node eng/browser-smoke/deployment.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Retain predeploy smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-predeploy-${{ github.run_id }}
          path: .cache/pages-smoke
          retention-days: 14

  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    needs: [build-and-test, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned Wasmtime
        run: |
          curl --fail --location --retry 3 --output /tmp/wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            'ca1fc56d1afc40c8782e96c297fd182a0da162f9a8f52a1e7b094e1dd648e178' \
            /tmp/wasmtime.tar.xz | sha256sum --check --strict
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: Wait for the deployed toolchain
        env:
          PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_TOOLCHAIN_ID: ${{ needs.build-and-test.outputs.toolchain_id }}
        run: |
          index_url="${PLAYGROUND_URL%/}/toolchain/index.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --output /tmp/live-toolchain-index.json "$index_url"; then
              actual_id=$(python3 -c 'import json; print(json.load(open("/tmp/live-toolchain-index.json"))["id"])' 2>/dev/null || true)
              if [ "$actual_id" = "$EXPECTED_TOOLCHAIN_ID" ]; then
                exit 0
              fi
            fi
            echo "Waiting for deployed toolchain (attempt $attempt of 60)"
            sleep 5
          done
          echo "Expected deployed toolchain $EXPECTED_TOOLCHAIN_ID was not available at $index_url" >&2
          exit 1
      - name: Smoke-test the public deployment
        env:
          PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYGROUND_EVIDENCE: .cache/pages-live-smoke
        run: node eng/browser-smoke/deployment.mjs
      - name: Retain public deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-live-${{ github.run_id }}
          path: .cache/pages-live-smoke
          if-no-files-found: warn
          retention-days: 14

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Install verified browser toolchain
        run: python3 eng/toolchain-release.py install
      - name: Build production site
        env:
          PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned Wasmtime
        run: |
          curl --fail --location --retry 3 --output /tmp/wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz
          curl --fail --location --retry 3 --output /tmp/wasmtime.sha256 \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/SHASUMS256.txt
          grep ' wasmtime-v47.0.3-x86_64-linux.tar.xz$' /tmp/wasmtime.sha256 | sed 's#  wasmtime-v47.0.3-x86_64-linux.tar.xz#  /tmp/wasmtime.tar.xz#' | sha256sum --check --strict
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: Smoke-test production build
        env:
          PLAYGROUND_BASE: ${{ steps.pages.outputs.base_path }}/
          PLAYGROUND_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
          PLAYGROUND_EVIDENCE: .cache/pages-smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            curl --fail --silent "$PLAYGROUND_URL" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "$PLAYGROUND_URL" >/dev/null
          node eng/browser-smoke/deployment.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

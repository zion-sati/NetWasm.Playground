name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: playground-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      release_artifact: ${{ steps.release_archive.outputs.artifact }}
      release_archive: ${{ steps.release_archive.outputs.archive }}
      release_archive_sha256: ${{ steps.release_archive.outputs.sha256 }}
      source_ref: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: infrastructure
      - name: Resolve published GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          test "$(jq -r '.draft' release.json)" = false
          version="${RELEASE_TAG#v}"
          deploy=true
          if [[ "$version" == *-* ]]; then deploy=false; fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
      - name: Check out released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Verify released source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          source_commit="$(git -C source rev-parse HEAD)"
          test "$(git -C source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$source_commit"
          git -C source merge-base --is-ancestor "$source_commit" "refs/remotes/origin/${DEFAULT_BRANCH}"
      - name: Reuse published browser toolchain when resuming
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset="netwasm-playground-toolchain-${RELEASE_TAG}.tar.gz"
          mkdir -p .cache/release/output
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir .cache/release/output >/dev/null 2>&1; then
            python3 source/eng/toolchain-release.py install \
              --archive ".cache/release/output/$asset" \
              --output source/public/toolchain
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up .NET
        if: steps.published.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Install pinned NativeAOT-LLVM Emscripten toolchain
        if: steps.published.outputs.found != 'true'
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/nativeaot-pins.env"
          import json
          from pathlib import Path
          candidate = json.loads(Path('source/eng/upstream-sources.json').read_text())['nativeAotLlvmCandidate']
          print(f"EMSDK_REVISION={candidate['emsdkRevision']}")
          print(f"EMSCRIPTEN_VERSION={candidate['emscriptenVersion']}")
          PY
          source "$RUNNER_TEMP/nativeaot-pins.env"
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth=1 origin "$EMSDK_REVISION"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Set up Node.js
        if: steps.published.outputs.found != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: source/package-lock.json
      - if: steps.published.outputs.found != 'true'
        run: npm ci
        working-directory: source
      - name: Build NativeAOT-LLVM compiler host from pinned public inputs
        if: steps.published.outputs.found != 'true'
        run: |
          python3 source/eng/build-nativeaot-compiler.py \
            --emsdk "$RUNNER_TEMP/emsdk" \
            --output .cache/release/compiler-framework
      - name: Build content-addressed browser toolchain manifest
        if: steps.published.outputs.found != 'true'
        run: python3 source/eng/rebuild-public-toolchain.py --compiler-framework .cache/release/compiler-framework --output source/public/toolchain
      - name: Package reproducible release asset
        id: release_archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset="netwasm-playground-toolchain-${RELEASE_TAG}.tar.gz"
          artifact="browser-toolchain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p .cache/release/output
          if [[ ! -f ".cache/release/output/$asset" ]]; then
            python3 source/eng/toolchain-release.py pack \
              --source source/public/toolchain \
              --output ".cache/release/output/$asset"
          fi
          python3 source/eng/toolchain-release.py install \
            --archive ".cache/release/output/$asset" \
            --output .cache/release/install-check
          python3 - "$asset" <<'PY'
          import hashlib, json, pathlib, sys
          path = pathlib.Path('.cache/release/output') / sys.argv[1]
          receipt = {'name': path.name, 'bytes': path.stat().st_size,
                     'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          pathlib.Path('.cache/release/archive-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          cp .cache/release/archive-receipt.json .cache/release/output/archive-receipt.json
          sha256="$(jq -r '.sha256' .cache/release/archive-receipt.json)"
          {
            echo "artifact=$artifact"
            echo "archive=$asset"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Retain exact browser toolchain archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_archive.outputs.artifact }}
          path: .cache/release/output
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Attach toolchain to GitHub Release
        if: steps.published.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release_archive.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" ".cache/release/output/$ASSET#Browser toolchain" \
            --repo "$GITHUB_REPOSITORY"
      - name: Retain release receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-receipts-${{ github.run_id }}
          path: |
            .cache/release/archive-receipt.json
            .cache/release/compiler-framework/nativeaot-compiler-receipt.json
            source/public/toolchain/index.json
            source/public/toolchain/*/asset-manifest.json
          retention-days: 90

  pages:
    needs: build-release
    uses: ./.github/workflows/pages.yml
    with:
      deploy: ${{ needs.build-release.outputs.deploy == 'true' }}
      release_artifact: ${{ needs.build-release.outputs.release_artifact }}
      release_archive: ${{ needs.build-release.outputs.release_archive }}
      release_archive_sha256: ${{ needs.build-release.outputs.release_archive_sha256 }}
      source_ref: ${{ needs.build-release.outputs.source_ref }}
      version: ${{ needs.build-release.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write
